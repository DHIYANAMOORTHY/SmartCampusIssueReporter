apiVersion: apps/v1

kind: Deployment

metadata:
  name: smart-campus-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: smart-campus

  template:
    metadata:
      labels:
        app: smart-campus

    spec:
      containers:
        - name: smart-campus-container

          image: smart-campus-issue-reporter:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 80